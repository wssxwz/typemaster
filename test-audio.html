<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Audio Test</title></head>
<body style="padding:40px;font-family:sans-serif;">
<h1>🔊 音频测试</h1>

<h2>测试1: HTML5 Audio (点击播放)</h2>
<button onclick="
  var a = new Audio('https://ssl.gstatic.com/dictionary/static/sounds/20200429/hello--_gb_1.mp3');
  a.play().then(()=>log('✅ Audio play OK')).catch(e=>log('❌ Audio error: '+e.message));
" style="font-size:20px;padding:15px 30px;">播放 "Hello" (Google词典音频)</button>

<h2>测试2: speechSynthesis (点击播放)</h2>
<button onclick="
  if(!('speechSynthesis' in window)){log('❌ 不支持');return;}
  var u=new SpeechSynthesisUtterance('hello world');
  u.lang='en-US';
  u.onstart=()=>log('🔊 speech started');
  u.onend=()=>log('✅ speech ended');
  u.onerror=(e)=>log('❌ speech error: '+e.error);
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  log('speak() called, voices='+speechSynthesis.getVoices().length);
" style="font-size:20px;padding:15px 30px;">说 "Hello World" (speechSynthesis)</button>

<h2>测试3: 检查语音列表</h2>
<button onclick="
  var v=speechSynthesis.getVoices();
  log('总共 '+v.length+' 个语音');
  v.filter(x=>x.lang.startsWith('en')).slice(0,5).forEach(x=>log('  '+x.name+' ('+x.lang+')'));
  if(v.length===0) log('⚠️ 没有语音！可能需要等待加载');
" style="font-size:20px;padding:15px 30px;">列出可用语音</button>

<pre id="log" style="font-size:14px;background:#f5f5f5;padding:20px;margin-top:20px;border-radius:8px;max-height:300px;overflow:auto;"></pre>

<script>
function log(msg){
  var el=document.getElementById('log');
  el.textContent+=new Date().toLocaleTimeString()+' '+msg+'\n';
  el.scrollTop=el.scrollHeight;
}
log('页面加载完成');
log('speechSynthesis 支持: '+('speechSynthesis' in window));
log('Audio 支持: '+('Audio' in window));
speechSynthesis.onvoiceschanged=()=>log('voices changed: '+speechSynthesis.getVoices().length+' 个');
</script>
</body>
</html>
